<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoaFácil - APAE - Bananal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="btn-acessibilidade" onclick="toggleContraste()">Alto Contraste</button>
  
  <header>
    <h1>DoaFácil</h1>
    <p>APAE Bananal</p>
    <nav>
      <button onclick="mostrarAba('doar')" class="active" id="btn-doar">Quero Doar</button>
      <button onclick="mostrarAba('gestor')" id="btn-gestor">Painel Gestor</button>
    </nav>
  </header>

  <main>
    <section id="aba-doar" class="aba">
      <div class="card">
        <h2>Faça sua doação</h2>
        <form id="formDoacao">
          <label class="linha-check"><input type="checkbox" id="anonimo"> Doação Anônima</label>
          <div id="campos-nome">
            <input type="text" id = "nome" placeholder = "Nome completo" required>
            <input type="email" id = "email" placeholder = "E-mail" required>
            
            <h3 style="margin:12px 0 5px;font-size:15px">Endereço</h3>
            <div class="row">
              <input type="text" id="cep" placeholder="CEP 12850-085" maxlength="9" onblur="buscarCEP()">
              <button type="button" class="btn-primary" onclick="buscarCEP()" style="flex: 0.5;">Buscar CEP</button>
            </div>
            <div id="cep-status" style="font-size:12px;color:#555;margin-bottom:5px"></div>
            <div class="row">
              <input type="text" id="logradouro" placeholder="Logradouro" style="flex:3.5">
              <input type="text" id="numero" placeholder="Nº" style="flex:0.5">
            </div>
            <div class="row">
              <input type="text" id="bairro" placeholder="Bairro">
              <input type="text" id="cidade" placeholder="Cidade">
            </div>
            <div class="row">
              <input type="text" id="estado" placeholder="UF" maxlength="2" style="flex:1">
              <input type="text" id="complemento" placeholder="Complemento" style="flex:3">
            </div>
          </div>

          <div class="row">
            <select id="tipo" required>
              <option value="">Tipo de doação</option>
              <option value="Dinheiro">Dinheiro</option>
              <option value="Alimento">Alimento</option>
              <option value="Roupa">Roupa</option>
              <option value="Outros">Outros</option>
            </select>
            <input type="text" id="valor" placeholder="R$50 ou 5kg" required>
          </div>
          <select id="pagamento" required>
            <option value="">Forma de entrega / pagamento</option>
            <option value="PIX">PIX</option>
            <option value="Cartão">Cartão</option>
            <option value="Entrega no local">Entrega no local</option>
            <option value="Coleta no endereço">Coleta no endereço</option>
          </select>
          <textarea id="mensagem" placeholder="Mensagem opcional"></textarea>
          <button type="submit" class="btn-primary">Cadastrar Doação</button>
        </form>
        <div id="pix-area" class="hidden">
          <h3>PIX Copia e Cola</h3>
          <code>00020126580014br.gov.bcb.pix...DoaFacil</code>
        </div>
      </div>
    </section>

    <section id="aba-gestor" class="aba hidden">
      <div class="card">
        <div class="gestor-header">
          <h2>Painel Gestor</h2>
          <div class="stats">
            <div><strong id="total-geral">R$ 0</strong><span>Total</span></div>
            <div><strong id="total-itens">0</strong><span>Doações</span></div>
          </div>
        </div>
        <div class="acoes">
          <input type="text" id="filtro" placeholder="Filtrar por nome, cidade...">
          <button onclick="exportarCSV()">Exportar CSV</button>
          <button onclick="limparTudo()" class="btn-danger">Apagar Dados</button>
        </div>
        <table>
          <thead><tr><th>Data</th><th>Doador</th><th>Tipo</th><th>Valor</th><th>Cidade</th><th>Endereço</th><th>Recibo</th></tr></thead>
          <tbody id="tabelaDoacoes"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
